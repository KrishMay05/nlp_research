[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quote-power"
version = "0.1.0"
description = "Quote-grounded arguments for conversational power"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pulp>=3,<4", "openai>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
quote-power = "quote_power.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
